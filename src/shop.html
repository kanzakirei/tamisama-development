<!--include common/base.html-->
<!DOCTYPE html>
<html lang="jp">

<head>
  <title>TAMISAMA OFFICIAL SHOP</title>
  <link type="text/css" rel="stylesheet" href="css/base.css">
  <style>
    /* 画面全体のデザイン */
    body { font-family: sans-serif; margin: 30px; background: #f4f7f6; }
    h1 { color: #333; }
    
    /* 取得ボタンのデザイン */
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #008080; color: white; border: none; border-radius: 4px; }
    button:hover { background: #006666; }
    
    /* 商品を並べるグリッド配置（タイル状に自動整列） */
    #result { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    
    /* 商品カード1枚ずつのデザイン */
    .item-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .item-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    .item-title { font-weight: bold; margin: 10px 0 5px 0; font-size: 14px; }
    .item-price { color: #d9534f; font-size: 16px; font-weight: bold; }
    .item-stock { font-size: 12px; color: #666; margin-top: 5px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>

<body>
  <header>
  </header>
  <main>
    <div class="content center">
      <h1>BASE 商品一覧 取得テスト</h1>
      <!-- JavaScriptからクリックを検知するためのボタン -->
      <button id="fetch-btn">商品一覧を取得する</button>

      <!-- 取得した商品カードがここに自動で追加されます -->
      <div id="result"></div>
    </div>
  </main>
  <footer>
  </footer>
</body>

</html>
