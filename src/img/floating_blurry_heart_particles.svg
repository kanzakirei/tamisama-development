<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <path id="heart" d="M0 18C-10 8-28-4-25-18-22-31-5-31 0-17 5-31 22-31 25-18 28-4 10 8 0 18Z" fill="none" stroke="#fff" stroke-width="2.2"/>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .particle{filter:url(#glow);opacity:.34;transform-box:fill-box;transform-origin:center;animation:rise var(--duration) linear var(--delay) infinite}
      @keyframes rise{
        0%{transform:translate(0,100px) rotate(-12deg);opacity:0}
        12%{opacity:var(--alpha)}
        50%{transform:translate(var(--sway),-420px) rotate(8deg)}
        88%{opacity:var(--alpha)}
        100%{transform:translate(0,-1050px) rotate(-10deg);opacity:0}
      }
      @media(prefers-reduced-motion:reduce){.particle{animation:none;opacity:.15}}
    </style>
